name: Build & Push to GHCR

on:
  push:
    branches: [master, development]
  workflow_dispatch:

permissions:
  contents: write   # create release tag on master
  packages: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build_and_push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: 🧾 Checkout source
        uses: actions/checkout@v4

      - name: 📦 Get package version
        id: package-version
        run: echo "version=$(jq -r .version package.json)" >> $GITHUB_OUTPUT

      - name: 🏷️ lowercase owner
        id: owner
        run: echo "name=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: 🏷️ Image tags
        id: tags
        run: |
          IMG=ghcr.io/${{ steps.owner.outputs.name }}/pendek
          if [ "${GITHUB_REF_NAME}" = "master" ]; then
            echo "tags=${IMG}:${{ steps.package-version.outputs.version }},${IMG}:latest" >> $GITHUB_OUTPUT
          else
            echo "tags=${IMG}:development,${IMG}:development-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          fi

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 🔑 Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🛠️ Build & Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🔖 Tag release
        if: github.ref_name == 'master'
        run: |
          TAG=v${{ steps.package-version.outputs.version }}
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "$TAG already exists"
          else
            git tag "$TAG" && git push origin "$TAG"
          fi
